name: verify

on:
  pull_request:
  push:
    branches:
      - main
      - feat/nerve-p0

env:
  COPILOTKIT_TELEMETRY_DISABLED: "true"
  DO_NOT_TRACK: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
